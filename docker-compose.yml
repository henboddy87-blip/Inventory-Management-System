version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sme_inventory_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./inventory.db
      - SECRET_KEY=cambodian_sme_inventory_secret_key_change_in_production_2026_super_secure!
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000"]
    volumes:
      - ./backend/inventory.db:/app/inventory.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sme_inventory_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
